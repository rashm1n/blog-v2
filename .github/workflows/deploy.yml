name: Deploy

on:
  push:
    branches: [main]

# NOTE: runs-on below assumes an amd64 VPS. Run `uname -m` on the Hetzner box —
# if it says aarch64 (e.g. a Hetzner CAX instance), change both `runs-on` values
# to `ubuntu-24.04-arm` instead. Building amd64 on an arm64 host (or vice versa)
# via QEMU emulation works but is several times slower.

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "image=ghcr.io/${{ github.repository_owner }}/blog" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GISCUS_REPO=${{ vars.GISCUS_REPO }}
            GISCUS_REPO_ID=${{ vars.GISCUS_REPO_ID }}
            GISCUS_CATEGORY=${{ vars.GISCUS_CATEGORY }}
            GISCUS_CATEGORY_ID=${{ vars.GISCUS_CATEGORY_ID }}
            UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
            UMAMI_SCRIPT_URL=${{ vars.UMAMI_SCRIPT_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      # The edge Caddyfile is bind-mounted from /srv/blog and used to be updated
      # only by hand, so security-header changes committed here silently never
      # reached production — the step below restarts `blog` and nothing else.
      #
      # The VPS fetches the file itself rather than receiving it over scp.
      # appleboy/scp-action inspects the output of a probe command to decide how
      # to talk to the host, and this box prints `docker compose` output on
      # login — enough noise that scp-action concluded "remote server os type is
      # windows" and failed. ssh-action doesn't parse output that way, and the
      # repo is public, so a plain curl needs no credentials. Pinning to the
      # pushed SHA also guarantees the deployed file is exactly the reviewed one,
      # which `main` alone wouldn't.
      - name: Update and reload the edge Caddyfile
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /srv/blog
            mkdir -p staging

            curl -fsSL \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/Caddyfile" \
              -o staging/Caddyfile

            # DOMAIN is interpolated by the Caddyfile. Compose reads .env by
            # itself; a bare `docker run` does not.
            set -a; . ./.env; set +a

            # Validated before it is moved into place, so a config that doesn't
            # parse can never be left where it would stop Caddy coming back up
            # after a reboot.
            docker run --rm \
              -e DOMAIN="$DOMAIN" \
              -v /srv/blog/staging/Caddyfile:/etc/caddy/Caddyfile:ro \
              -v /srv/blog/certs:/certs:ro \
              caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

            if cmp -s staging/Caddyfile Caddyfile; then
              echo "Caddyfile unchanged"
            else
              cp Caddyfile "Caddyfile.bak.$(date +%s)"
              mv staging/Caddyfile Caddyfile
              # Atomic: Caddy rejects a bad config and keeps serving the old one.
              docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
              echo "Caddyfile updated and reloaded"
            fi

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /srv/blog
            docker compose pull blog
            docker compose up -d blog
            docker image prune -f
