name: Deploy

on:
  push:
    branches: [main]

# NOTE: runs-on below assumes an amd64 VPS. Run `uname -m` on the Hetzner box —
# if it says aarch64 (e.g. a Hetzner CAX instance), change both `runs-on` values
# to `ubuntu-24.04-arm` instead. Building amd64 on an arm64 host (or vice versa)
# via QEMU emulation works but is several times slower.

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "image=ghcr.io/${{ github.repository_owner }}/blog" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GISCUS_REPO=${{ vars.GISCUS_REPO }}
            GISCUS_REPO_ID=${{ vars.GISCUS_REPO_ID }}
            GISCUS_CATEGORY=${{ vars.GISCUS_CATEGORY }}
            GISCUS_CATEGORY_ID=${{ vars.GISCUS_CATEGORY_ID }}
            UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
            UMAMI_SCRIPT_URL=${{ vars.UMAMI_SCRIPT_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      # ---------------------------------------------------------------------
      # THIS SCRIPT IS NOT WHAT RUNS ON THE VPS.
      #
      # The deploy key is registered in the VPS's authorized_keys as
      #   restrict,command="/home/rush/bin/gh-deploy.sh" ssh-ed25519 AAAA...
      # so sshd ignores whatever command arrives and runs that file instead,
      # putting what we send in $SSH_ORIGINAL_COMMAND. The key can do nothing
      # else, which is the point — but it also means the real deploy logic
      # lives in `deploy/gh-deploy.sh` (the version-controlled copy of that
      # file), and editing the block below changes nothing in production.
      #
      # This was not obvious: the previous script here happened to be
      # character-for-character what gh-deploy.sh does, so deploys looked like
      # they were running it for months. What we send is now just the commit
      # SHA, which gh-deploy.sh validates as 40 hex chars and uses to fetch the
      # matching deploy/Caddyfile.
      # ---------------------------------------------------------------------
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: ${{ github.sha }}
